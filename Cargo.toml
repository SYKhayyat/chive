[package]
name = "chive"
version = "0.1.0"
edition = "2024"
description = "The home.nix you never wrote: an imperative NixOS, read back off a machine that already exists."
license = "MIT"
# Pinned so the musl-static build (D21, and therefore the whole container
# harness) is reproducible: without it, "run build-static.sh" means whatever the
# machine's default toolchain happens to be, which is not a version. 1.87 is what
# the code already requires — pinning lower immediately trips clippy's
# `incompatible_msrv` lint, which is the point of pinning it at all.
rust-version = "1.87"
autotests = false
default-run = "chive"

[[bin]]
name = "chive"
path = "src/main.rs"

[lib]
name = "chive"
path = "src/lib.rs"

# autotests = false: every integration test file is pulled in as a `mod` from
# tests/main.rs. This single [[test]] becomes the only integration target.
[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
libc = "0.2.189"
rhai = "1.26.1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"

[profile.release]
lto = true
