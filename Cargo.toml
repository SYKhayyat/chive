[package]
name = "chive"
version = "0.1.0"
edition = "2024"
description = "Reconstruction engine: scan a machine, keep a recipe for every meaningful file, re-derive what is missing."
license = "MIT"
autotests = false
default-run = "chive"

[[bin]]
name = "chive"
path = "src/main.rs"

[lib]
name = "chive"
path = "src/lib.rs"

# autotests = false: every integration test file is pulled in as a `mod` from
# tests/main.rs. This single [[test]] becomes the only integration target.
[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
libc = "0.2.189"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"

[profile.release]
lto = true
