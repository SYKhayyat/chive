[advisories]
yanked = "warn"
ignore = []

# Direct dependencies: clap, serde, toml, rusqlite, walkdir, thiserror, chrono,
# regex, libc, rhai. All are MIT or MIT/Apache-2.0 dual-licensed; rusqlite and
# rhai pull in other permissive licenses transitively, which is what the
# confidence-threshold below absorbs.
#
# This comment used to name seven of the ten and was written before `regex`,
# `libc` and `rhai` existed -- and `rhai` is what D21's whole ruling turns on.
# A stale allow-list is worse than none, because it looks maintained.
[licenses]
allow = ["MIT", "Apache-2.0", "BSL-1.0", "Unicode-3.0", "ISC"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]