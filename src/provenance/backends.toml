# Built-in package-manager adapters.
#
# This file is data that the runtime reads, not code: to improve an existing
# manager, edit its row; to teach chive a manager it has never heard of, add a
# [[manager]] row exactly like the ones here. Users add their own adapters in
# <config-dir>/adapters/*.toml, which are loaded after this built-in set.
#
# Fields:
#   name          — identifier used in error messages and recipes.
#   os            — OS-family filter: "linux" | "macos" | "windows" | "any".
#                   Empty means the row applies to every OS.
#   program       — (argv probe) the binary to run; must be on PATH to be tried.
#   detect_args   — (argv probe) argument templates; {path} is the absolute path.
#   path_prefix   — (path probe) files under this prefix are owned by a package;
#                   mutually exclusive with program+detect_args.
#   name_match    — regex whose capture group 1 is the package name. Against
#                   probe stdout for argv probes, or against the file path for
#                   path probes.
#   restore       — the recipe that reinstalls the package. {pkg} is the package
#                   this file belongs to; {dest} is only used when the manager
#                   needs it (most package managers place the file themselves).

# Debian / Ubuntu / derivatives.
[[manager]]
name = "dpkg"
os = ["linux"]
program = "dpkg"
detect_args = ["-S", "{path}"]
name_match = '^([^: ]+)'
restore = "sudo apt-get install --reinstall {pkg}"

# Arch / EndeavourOS / Manjaro (pacman).
[[manager]]
name = "pacman"
os = ["linux"]
program = "pacman"
detect_args = ["-Qo", "{path}"]
name_match = '(?m)^[^ ].* is owned by ([^ ]+)'
restore = "sudo pacman -S {pkg}"

# Fedora / RHEL / CentOS / openSUSE-with-rpm (rpm -qf prints pkg-ver-rel).
[[manager]]
name = "rpm"
os = ["linux"]
program = "rpm"
detect_args = ["-qf", "{path}"]
name_match = '^([A-Za-z0-9_+.-]+?)(?:-[0-9][^- ]*)?$'
restore = "sudo dnf reinstall {pkg}"

# openSUSE's zypper owns rpm files too, but dnf reinstall covers rpm-family.
# DNF is separated so a dnf-based machine is unambiguous.
[[manager]]
name = "dnf"
os = ["linux"]
program = "dnf"
detect_args = ["repoquery", "-f", "{path}"]
name_match = '^([^: ]+)$'
restore = "sudo dnf reinstall {pkg}"

# Homebrew (macOS + Linuxbrew). A file under the Cellar is owned by the formula
# whose directory holds it; no ownership probe to run.
[[manager]]
name = "brew"
os = ["macos"]
path_prefix = "/opt/homebrew/Cellar/"
name_match = '^/opt/homebrew/Cellar/([^/]+)/'
restore = "brew reinstall {pkg}"

# Alpine.
[[manager]]
name = "apk"
os = ["linux"]
program = "apk"
detect_args = ["info", "-W", "{path}"]
name_match = '^([^ ]+) '
restore = "sudo apk add --upgrade {pkg}"

# Void.
[[manager]]
name = "xbps"
os = ["linux"]
program = "xbps-query"
detect_args = ["-f", "{path}"]
name_match = '^([^ -]+) '
restore = "sudo xbps-install -S {pkg}"

# Nix / NixOS. Ownership is not a simple reverse lookup; nix-store realises the
# path and the derivation appears in `nix-store -q --deriver`. We keep this
# conservative: fall back to git/symlink/orphan if nix is the only owner.
[[manager]]
name = "nix"
os = ["linux"]
program = "nix-store"
detect_args = ["-q", "--deriver", "{path}"]
name_match = '^([^ ]+\.drv)$'
restore = "nix profile install {pkg}"