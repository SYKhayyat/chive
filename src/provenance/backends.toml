# Built-in package-manager adapters.
#
# This file is data that the runtime reads, not code: to improve an existing
# manager, edit its row; to teach chive a manager it has never heard of, add a
# [[manager]] row exactly like the ones here. Users add their own adapters in
# <config-dir>/adapters/*.toml, which are loaded after this built-in set.
#
# Fields:
#   name          — identifier used in error messages and recipes.
#   os            — OS-family filter: "linux" | "macos" | "windows" | "any".
#                   Empty means the row applies to every OS.
#   program       — (argv probe) the binary to run; must be on PATH to be tried.
#   detect_args   — (argv probe) argument templates; {path} is the absolute path.
#   path_prefix   — (path probe) files under this prefix are owned by a package;
#                   mutually exclusive with program+detect_args.
#   name_match    — regex whose capture group 1 is the package name. Against
#                   probe stdout for argv probes, or against the file path for
#                   path probes.
#   restore       — the recipe that reinstalls the package. {pkg} is the package
#                   this file belongs to; {dest} is only used when the manager
#                   needs it (most package managers place the file themselves).

# Debian / Ubuntu / derivatives.
[[manager]]
name = "dpkg"
os = ["linux"]
program = "dpkg"
detect_args = ["-S", "{path}"]
name_match = '^([^: ]+)'
restore = "sudo apt-get install --reinstall {pkg}"

# Arch / EndeavourOS / Manjaro (pacman).
[[manager]]
name = "pacman"
os = ["linux"]
program = "pacman"
detect_args = ["-Qo", "{path}"]
name_match = '(?m)^[^ ].* is owned by ([^ ]+)'
restore = "sudo pacman -S {pkg}"

# Fedora / RHEL / CentOS / openSUSE-with-rpm. --queryformat asks rpm for the
# bare package name itself, so no regex has to guess where name ends and
# version begins (the old capture glued pkg-version into the recipe).
[[manager]]
name = "rpm"
os = ["linux"]
program = "rpm"
detect_args = ["-qf", "--queryformat", "%{NAME}", "{path}"]
name_match = '^([A-Za-z0-9_+.-]+)$'
restore = "sudo dnf reinstall {pkg}"

# DNF-based machines without rpm on PATH: repoquery -f prints the path, the
# --queryformat form prints the bare name.
[[manager]]
name = "dnf"
os = ["linux"]
program = "dnf"
detect_args = ["repoquery", "--queryformat", "%{NAME}", "-f", "{path}"]
name_match = '^([A-Za-z0-9_+.-]+)$'
restore = "sudo dnf reinstall {pkg}"

# Homebrew (macOS + Linuxbrew). A file under the Cellar is owned by the formula
# whose directory holds it; no ownership probe to run.
[[manager]]
name = "brew"
os = ["macos"]
path_prefix = "/opt/homebrew/Cellar/"
name_match = '^/opt/homebrew/Cellar/([^/]+)/'
restore = "brew reinstall {pkg}"

# Alpine. `apk info -W <path>` is path-first: "<path> is owned by
# <pkg>-<ver>-r<rev>". The name/version boundary is the hyphen before the
# version, anchored by the trailing `-r<rev>` revision suffix.
[[manager]]
name = "apk"
os = ["linux"]
program = "apk"
detect_args = ["info", "-W", "{path}"]
name_match = 'is owned by (.+)-[^-]+-r[0-9]+$'
restore = "sudo apk add --upgrade {pkg}"

# Void. `xbps-query -o <path>` answers "<pkgver>: <path> (<type>)" where
# <pkgver> is "pkg-ver_rel"; the bare name is everything before the last
# hyphen of the first field. (The old probe asked -f, which lists a package's
# files and does not answer ownership at all.)
[[manager]]
name = "xbps"
os = ["linux"]
program = "xbps-query"
detect_args = ["-o", "{path}"]
name_match = '^(.+)-[0-9][^-_]*_[0-9]+:'
restore = "sudo xbps-install -S {pkg}"

# Nix / NixOS: deliberately absent. `nix-store -q --deriver` names a
# *derivation* (.drv) that exists only on the source machine's store, and no
# package-manager verb re-derives a file from it on a fresh one — the old
# adapter captured the .drv path and wrote it into `nix profile install`,
# which can only fail. Its comment claimed fallback to git/symlink/orphan;
# removal is what makes the code match that. Files under /nix/store now fall
# through honestly until a real nix recipe exists (a scoped issue, not a
# regex fix).